# 仅在「希望 5001 单端口同时承载 boc-monitor 与刷题宝同步」时使用。
# 前置条件（需 SSH 到服务器操作）：
#   1. 把 boc-monitor 改为监听 127.0.0.1:5100（仅本机）
#   2. 把 server/server.js 的监听改为 127.0.0.1:8080
#   3. 安装 nginx，把本文件放到 /etc/nginx/conf.d/ 或 http 块内，然后 nginx -t && nginx -s reload
#   4. 安全组/防火墙保持只开放 5001
#
# 客户端填「服务地址」时写： http://112.124.69.19:5001/shuati
# 打开页面也走：            http://112.124.69.19:5001/shuati/

server {
    listen 5001;
    listen [::]:5001;
    server_name _;

    # 刷题宝同步服务：/shuati/ 前缀剥离后转发到 8080
    # 例：/shuati/rest/v1/sync_data -> 127.0.0.1:8080/rest/v1/sync_data
    location /shuati/ {
        proxy_pass http://127.0.0.1:8080/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 64m;
    }

    # 其余流量原样交给 boc-monitor（已迁到本机 5100）
    location / {
        proxy_pass http://127.0.0.1:5100;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
